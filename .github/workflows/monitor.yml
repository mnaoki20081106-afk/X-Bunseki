name: SNS Buzz Monitor

on:
  schedule:
    # 毎時0分に実行 (UTC基準。日本時間は+9時間)
    - cron: "0 * * * *"
  workflow_dispatch: {}  # 手動実行ボタンもGitHub上に出る

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Restore DB (重複通知防止用)
        uses: actions/cache@v4
        with:
          path: data/monitor.db
          key: monitor-db-${{ github.run_id }}
          restore-keys: |
            monitor-db-

      - name: Restore X login session
        run: echo "${{ secrets.X_SESSION_STATE }}" | base64 -d > storage_state.json

      - name: Run monitor
        env:
          X_SESSION_STATE_PATH: storage_state.json
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python main.py

      - name: Clean up session file
        if: always()
        run: rm -f storage_state.json
