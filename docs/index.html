<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal Filter</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#101316;--surface:#171b1f;--border:#2a3038;--text:#e7eaed;--muted:#8b939c;--faint:#565e67;--accent:#e8a33d;--danger:#d9584a;--ok:#5fb587;--radius:3px;--mono:'IBM Plex Mono',monospace;--sans:Inter,system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:28px 20px 80px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}.dot.live{background:var(--ok);box-shadow:0 0 12px rgba(95,181,135,.5)}.dot.err{background:var(--danger)}.dot.busy{background:var(--accent);animation:p 1s infinite}
@keyframes p{50%{opacity:.3}}h1{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:0}
.st{font-family:var(--mono);font-size:11px;color:var(--faint)}.sub{font-size:13px;color:var(--muted);margin:4px 0 18px}
.tabs{display:flex;gap:6px;margin:0 0 18px;border-bottom:1px solid var(--border)}
.tab{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:0;border:0;color:var(--faint);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.sl{font-family:var(--mono);font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.sv{font-family:var(--mono);font-size:22px;font-weight:700;margin-top:4px}.sv.ac{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--muted)}
textarea,input[type=password],input[type=text]{width:100%;padding:10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px}
textarea{min-height:88px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{font-family:var(--mono);font-size:12px;font-weight:600;padding:9px 14px;border-radius:var(--radius);cursor:pointer;border:1px solid var(--border)}
.bp{background:var(--accent);color:#101316;border-color:var(--accent)}.bp:disabled{opacity:.4;cursor:not-allowed}
.bg{background:transparent;color:var(--muted)}.bg:hover{color:var(--text);border-color:var(--muted)}
.list{max-height:360px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg)}
.word{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:13px}
.word:last-child{border-bottom:0}.word.del{opacity:.4;text-decoration:line-through}
.word button{padding:4px 8px;font-size:11px}
.empty{padding:24px;text-align:center;color:var(--faint);font-size:12px;font-family:var(--mono)}
.log{font-family:var(--mono);font-size:12px;padding:10px 12px;border-radius:var(--radius);margin-top:12px;display:none;white-space:pre-wrap}
.log.show{display:block}.log.ok{background:rgba(95,181,135,.08);border:1px solid rgba(95,181,135,.25);color:var(--ok)}
.log.err{background:rgba(217,88,74,.08);border:1px solid rgba(217,88,74,.25);color:#ed9186}
.log.info{background:rgba(232,163,61,.06);border:1px solid rgba(232,163,61,.2);color:var(--accent)}
.hit{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px}
.hit.star{border-color:rgba(232,163,61,.45);background:rgba(232,163,61,.06)}
.ht{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;margin-bottom:4px}
.sc{font-family:var(--mono);font-weight:700;color:var(--accent);font-size:16px}
.meta{font-family:var(--mono);font-size:11px;color:var(--muted)}
.tx{font-size:13px;color:var(--muted);margin:4px 0 8px;word-break:break-word}
.lk{font-family:var(--mono);font-size:11px;color:var(--accent);text-decoration:none}
.hint{font-size:11px;color:var(--faint);margin-top:6px;line-height:1.4}
footer{margin-top:32px;font-family:var(--mono);font-size:10.5px;color:var(--faint);text-align:center}
@media(max-width:520px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand"><span class="dot" id="dot"></span><h1>Signal Filter</h1></div>
  <span class="st" id="conn">読み込み中...</span>
</header>
<p class="sub" id="sub">バズ検知の対象ワードと条件通過ポストを管理します（GitHub Pages）。</p>
<p class="st" id="lastMonitor" style="margin:-10px 0 16px">最終監視: 読み込み中...</p>
<nav class="tabs">
  <button type="button" class="tab active" id="tab-kw" onclick="go('kw')">キーワード</button>
  <button type="button" class="tab" id="tab-hits" onclick="go('hits')">投稿一覧</button>
</nav>

<div id="panel-kw">
  <div class="stats">
    <div class="stat"><div class="sl">登録ワード数</div><div class="sv ac" id="nTotal">—</div></div>
    <div class="stat"><div class="sl">追加予定</div><div class="sv" id="nAdd">0</div></div>
    <div class="stat"><div class="sl">削除予定</div><div class="sv" id="nDel">0</div></div>
  </div>
  <div class="card">
    <label>GitHub PAT（保存時のみ・ブラウザ内に保管）</label>
    <input type="password" id="pat" placeholder="ghp_... repo スコープ" autocomplete="off">
    <p class="hint">keywords.txt を更新するために必要です。Cloudflare は使いません。トークンは localStorage にだけ保存されます。</p>
    <div class="row"><button type="button" class="bg" onclick="savePat()">トークンを保存</button><button type="button" class="bg" onclick="clearPat()">削除</button></div>
  </div>
  <div class="card">
    <label>ワードを追加</label>
    <textarea id="addBox" placeholder="1行1ワード / カンマ区切りOK"></textarea>
    <div class="row">
      <button type="button" class="bp" onclick="stageAdd()">一覧に追加</button>
      <button type="button" class="bg" onclick="$('addBox').value=''">クリア</button>
    </div>
  </div>
  <div class="card">
    <label>登録ワード一覧</label>
    <div class="list" id="wordList"><div class="empty">読み込み中...</div></div>
  </div>
  <div class="row">
    <button type="button" class="bp" id="saveBtn" onclick="save()" disabled>変更を保存</button>
    <button type="button" class="bg" onclick="loadKw()">再読み込み</button>
  </div>
  <div class="log" id="log"></div>
</div>

<div id="panel-hits" style="display:none">
  <div class="stats">
    <div class="stat"><div class="sl">監視</div><div class="sv" id="hSt" style="font-size:16px">—</div></div>
    <div class="stat"><div class="sl">足切り通過</div><div class="sv ac" id="hSur">—</div></div>
    <div class="stat"><div class="sl">候補★</div><div class="sv" id="hCan">—</div></div>
  </div>
  <div class="row" style="margin-bottom:12px"><button type="button" class="bg" onclick="loadHits()">再読み込み</button></div>
  <div class="tabs" style="margin-bottom:14px">
    <button type="button" class="tab active" id="feed-early" onclick="showFeed('early')">早期発見</button>
    <button type="button" class="tab" id="feed-trending" onclick="showFeed('trending')">🔥 バズっている</button>
  </div>
  <div class="log" id="hLog"></div>
  <div id="hits"></div>
</div>
<footer>GitHub Pages · keywords.txt · hits.json</footer>
</div>
<script>
const REPO = { owner: 'mnaoki20081106-afk', repo: 'X-Bunseki', path: 'keywords.txt', branch: 'main' };
const RAW = {
  keywords: [
    'keywords.txt',
    'https://raw.githubusercontent.com/mnaoki20081106-afk/X-Bunseki/main/keywords.txt',
    'https://cdn.jsdelivr.net/gh/mnaoki20081106-afk/X-Bunseki@main/keywords.txt',
  ],
  hits: [
    'hits.json',
    'https://raw.githubusercontent.com/mnaoki20081106-afk/X-Bunseki/main/hits.json',
    'https://cdn.jsdelivr.net/gh/mnaoki20081106-afk/X-Bunseki@main/hits.json',
  ],
  status: [
    'status.json',
    'https://raw.githubusercontent.com/mnaoki20081106-afk/X-Bunseki/main/status.json',
    'https://cdn.jsdelivr.net/gh/mnaoki20081106-afk/X-Bunseki@main/status.json',
  ],
};
const $=id=>document.getElementById(id);
const PAT_KEY = 'xbunseki_gh_pat';
let S={words:[],add:[],del:new Set(),ok:false,sha:null,rawText:''};
let H={early:[],trending:[],feed:'early'};
function live(m){$('dot').className='dot '+(m||'')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]))}
function parse(t){const u=[],seen=new Set();for(const line of t.split(/\r?\n/)){const L=line.trim();if(!L||L.startsWith('#'))continue;for(const p of L.split(/[,、]/)){const w=p.trim();if(w&&!seen.has(w)){seen.add(w);u.push(w)}}}return u}
function getPat(){return localStorage.getItem(PAT_KEY)||$('pat').value.trim()}
function savePat(){const t=$('pat').value.trim();if(t){localStorage.setItem(PAT_KEY,t);$('log').className='log show ok';$('log').textContent='✅ トークンをブラウザに保存しました'}else{clearPat()}}
function clearPat(){localStorage.removeItem(PAT_KEY);$('pat').value='';$('log').className='log show info';$('log').textContent='トークンを削除しました'}
function go(name){
  $('tab-kw').classList.toggle('active',name==='kw');
  $('tab-hits').classList.toggle('active',name==='hits');
  $('panel-kw').style.display=name==='kw'?'':'none';
  $('panel-hits').style.display=name==='hits'?'':'none';
  $('sub').textContent=name==='kw'?'バズ検知の対象ワードを管理します。':'条件通過ポストを予測最終インプレッション順で表示します。';
  if(name==='hits')loadHits();
}
function render(){
  $('nTotal').textContent=S.words.length;
  $('nAdd').textContent=S.add.length;
  $('nDel').textContent=S.del.size;
  $('saveBtn').disabled=!S.ok||(S.add.length===0&&S.del.size===0);
  const all=[...S.words,...S.add.filter(w=>!S.words.includes(w))];
  if(!all.length){$('wordList').innerHTML='<div class="empty">ワードなし</div>';return}
  $('wordList').innerHTML=all.map(w=>{
    const pending=S.add.includes(w)&&!S.words.includes(w);
    const dead=S.del.has(w);
    return `<div class="word${dead?' del':''}"><span>${esc(w)}${pending?' <small style="color:var(--accent)">+新</small>':''}</span>
      <button type="button" class="bg" onclick="toggleDel('${esc(w).replace(/'/g,"\\'")}')">${dead?'復活':'削除'}</button></div>`;
  }).join('');
}
function stageAdd(){const ws=parse($('addBox').value);for(const w of ws){if(!S.words.includes(w)&&!S.add.includes(w))S.add.push(w)}$('addBox').value='';render()}
function toggleDel(w){if(S.del.has(w))S.del.delete(w);else S.del.add(w);render()}
async function fetchText(urls){let last;for(const u of urls){try{const r=await fetch(u+(u.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.text()}catch(e){last=e}}throw last}
async function fetchJson(urls){let last;for(const u of urls){try{const r=await fetch(u+(u.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}catch(e){last=e}}throw last}
async function loadKw(){
  live('busy');$('conn').textContent='読み込み中...';$('log').className='log';
  try{
    const text=await fetchText(RAW.keywords);
    S.rawText=text;S.words=parse(text);S.add=[];S.del=new Set();S.ok=true;S.sha=null;
    // sha for API write
    const pat=getPat();
    if(pat){
      try{
        const api=`https://api.github.com/repos/${REPO.owner}/${REPO.repo}/contents/${REPO.path}?ref=${REPO.branch}`;
        const r=await fetch(api,{headers:{Authorization:'Bearer '+pat,'Accept':'application/vnd.github+json'}});
        if(r.ok){const d=await r.json();S.sha=d.sha}
      }catch(_){}
    }
    live('live');$('conn').textContent=S.words.length+'件のワードを管理中';render();
  }catch(e){live('err');$('conn').textContent='読み込みエラー';$('log').className='log show err';$('log').textContent='❌ '+e.message}
}
function buildFileContent(){
  // keep header comments from original
  const lines=S.rawText.split(/\r?\n/);
  const header=[];
  for(const line of lines){
    const t=line.trim();
    if(!t||t.startsWith('#'))header.push(line);
    else break;
  }
  if(!header.length)header.push('# keywords.txt — 投稿収集の参考ワード','#');
  const keep=S.words.filter(w=>!S.del.has(w));
  const extra=S.add.filter(w=>!keep.includes(w));
  const body=[...keep,...extra];
  return header.join('\n').replace(/\s+$/,'')+'\n\n'+body.join('\n')+'\n';
}
async function save(){
  const pat=getPat();
  if(!pat){$('log').className='log show err';$('log').textContent='❌ 保存には GitHub PAT が必要です（上の欄に入力して「トークンを保存」）';return}
  $('saveBtn').disabled=true;$('log').className='log show info';$('log').textContent='保存中...';
  try{
    if(!S.sha){
      const api=`https://api.github.com/repos/${REPO.owner}/${REPO.repo}/contents/${REPO.path}?ref=${REPO.branch}`;
      const r=await fetch(api,{headers:{Authorization:'Bearer '+pat,'Accept':'application/vnd.github+json'}});
      if(!r.ok)throw new Error('ファイル情報の取得に失敗 HTTP '+r.status);
      S.sha=(await r.json()).sha;
    }
    const content=buildFileContent();
    const body={message:`Update keywords.txt via admin site (+${S.add.length} / -${S.del.size})`,content:btoa(unescape(encodeURIComponent(content))),sha:S.sha,branch:REPO.branch};
    const put=await fetch(`https://api.github.com/repos/${REPO.owner}/${REPO.repo}/contents/${REPO.path}`,{
      method:'PUT',headers:{Authorization:'Bearer '+pat,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)
    });
    const d=await put.json();
    if(!put.ok)throw new Error(d.message||('HTTP '+put.status));
    $('log').className='log show ok';$('log').textContent=`✅ 保存しました（commit ${ (d.commit&&d.commit.sha||'').slice(0,7) }）`;
    await loadKw();
  }catch(e){$('log').className='log show err';$('log').textContent='❌ '+e.message;$('saveBtn').disabled=false}
}
function formatMonitorTime(value){
  if(!value)return '不明';
  const d=new Date(value);
  if(Number.isNaN(d.getTime()))return '不明';
  return new Intl.DateTimeFormat('ja-JP',{
    timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false
  }).format(d)+' JST';
}
function showFeed(name){
  H.feed=name;
  $('feed-early').classList.toggle('active',name==='early');
  $('feed-trending').classList.toggle('active',name==='trending');
  renderHits();
}
function currentAgeMinutes(post){
  const ts=Date.parse(post&&post.posted_at||'');
  if(!Number.isFinite(ts))return null;
  return Math.max(0,(Date.now()-ts)/60000);
}
function freshTrendingPosts(){
  return H.trending.filter(p=>{
    const age=currentAgeMinutes(p);
    return age!==null&&age<=1440;
  });
}
function renderHits(){
  const posts=(H.feed==='trending'?freshTrendingPosts():H.early).slice();
  posts.sort(H.feed==='trending'
    ? (a,b)=>(b.impressions_per_min||0)-(a.impressions_per_min||0)||(b.impressions||0)-(a.impressions||0)
    : (a,b)=>(b.predicted_final_impressions||0)-(a.predicted_final_impressions||0));
  if(!posts.length){$('hits').innerHTML='<div class="empty">'+(H.feed==='trending'?'現在表示する大バズ投稿はありません':'早期発見投稿はありません')+'</div>';return}
  $('hits').innerHTML=posts.map(p=>{
    const sc=p.score??p.buzz_score;
    const liveAge=H.feed==='trending'?currentAgeMinutes(p):p.age_minutes;
    const age=liveAge!=null?Math.round(liveAge)+'m':'—';
    const lpm=p.likes_per_min!=null?Number(p.likes_per_min).toFixed(1):'—';
    const pred=p.predicted_final_impressions;
    const predText=pred!=null?(pred>=1000000?(pred/1000000).toFixed(1)+'M':Math.round(pred/1000)+'K'):'予測待ち';
    const imp=p.impressions!=null?Number(p.impressions).toLocaleString():'—';
    const ipm=p.impressions_per_min!=null?Number(p.impressions_per_min).toFixed(0):'—';
    const iacc=p.impressions_acceleration!=null?Number(p.impressions_acceleration).toFixed(2)+'x':'—';
    const title=H.feed==='trending'?'現在 '+imp+' imp':'予測 '+predText+' imp';
    const mega=p.mega_viral?' · 👹 850万+':'';
    return `<div class="hit${p.candidate?' star':''}"><div class="ht">
      <span class="sc">${title}</span>
      <span class="meta">${esc(p.prediction_confidence||'—')} · 従来${sc!=null?Math.round(sc):'—'}点${p.candidate?' ★':''}${mega}</span>
      <span class="meta">@${esc(p.author||'')}</span>
      <span class="meta">${age} · 現在imp ${imp} · ${ipm} imp/分 · 加速 ${iacc}</span>
      <span class="meta">いいね${p.likes!=null?Number(p.likes).toLocaleString():'—'} · ${lpm}いいね/分 · 返信${p.replies??'—'} · RT${p.retweets??'—'}</span>
    </div><div class="tx">${esc(p.text||'(文なし/画像など)')}</div>
    ${p.url?`<a class="lk" href="${esc(p.url)}" target="_blank" rel="noopener">投稿を開く →</a>`:''}</div>`;
  }).join('');
}
async function loadHits(){
  live('busy');$('hits').innerHTML='<div class="empty">読み込み中...</div>';$('hLog').className='log';
  try{
    let hits={},st={};
    try{hits=await fetchJson(RAW.hits)}catch(_){hits={posts:[]}}
    try{st=await fetchJson(RAW.status)}catch(_){}
    const status=st.status||'unknown';
    const monitoredAt=hits.updated_at||st.started_at||st.updated_at;
    const monitorText=formatMonitorTime(monitoredAt);
    $('lastMonitor').textContent='最終監視: '+monitorText;
    $('hSt').textContent=(status==='success'?'成功':status)+' · '+monitorText.replace(/:\d{2} JST$/,' JST');
    $('hSt').title='実際に巡回を開始した時刻: '+monitorText;
    $('hSt').style.color=status==='success'?'var(--ok)':status==='session_expired'?'var(--danger)':'var(--text)';
    $('hSur').textContent=hits.surviving??(hits.posts||[]).length;
    $('hCan').textContent=hits.candidates??'—';
    H.early=hits.early_posts||hits.posts||[];
    H.trending=hits.trending_posts||[];
    $('hSur').textContent=H.early.length;
    renderHits();
    live(status==='session_expired'||status==='error'?'err':'live');
    $('conn').textContent=`早期 ${H.early.length}件 · バズ中 ${freshTrendingPosts().length}件`;
  }catch(e){live('err');$('hits').innerHTML='<div class="empty">失敗</div>';$('hLog').className='log show err';$('hLog').textContent='❌ '+e.message}
}
$('pat').value=localStorage.getItem(PAT_KEY)||'';
loadKw();
</script>
</body>
</html>
