name: Temporary authenticated X page probe
on:
  push:
    branches: [fix/query-discovery-diagnostics]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check first-party X page
        env:
          X_SESSION_STATE_B64: ${{ secrets.X_SESSION_STATE }}
        run: |
          node --input-type=module <<'JS'
          const state=JSON.parse(process.env.X_SESSION_STATE_B64||'{}');
          const cookies=Object.fromEntries((state.cookies||[]).map(c=>[c.name,c.value]));
          if (!cookies.auth_token || !cookies.ct0) throw new Error('session_unavailable');
          const response=await fetch('https://x.com/home',{headers:{cookie:'auth_token='+cookies.auth_token+'; ct0='+cookies.ct0},signal:AbortSignal.timeout(15000),redirect:'error'});
          const html=await response.text();
          console.log('home_status='+response.status+' has_main_bundle='+html.includes('responsive-web/client-web/main.'));
          JS
