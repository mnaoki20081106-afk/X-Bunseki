name: SNS Buzz Monitor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "trueにすると、実際のX検索をせずテスト通知だけ送る"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: sns-buzz-monitor
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        if: github.event.inputs.test_notification != 'true'
        run: playwright install --with-deps chromium

      - name: Restore DB
        uses: actions/cache@v4
        with:
          path: data/monitor.db
          key: monitor-db-${{ github.run_id }}
          restore-keys: |
            monitor-db-

      - name: Restore X login session
        if: github.event.inputs.test_notification != 'true'
        run: echo "${{ secrets.X_SESSION_STATE }}" | base64 -d > storage_state.json

      - name: Run monitor
        env:
          X_SESSION_STATE_PATH: storage_state.json
          TEST_NOTIFICATION: ${{ github.event.inputs.test_notification }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          SCHOOL_STATUS_URL: ${{ secrets.SCHOOL_STATUS_URL }}
          SCHOOL_STATUS_SECRET: ${{ secrets.SCHOOL_STATUS_SECRET }}
          NOTIFY_SCORE: ${{ vars.NOTIFY_SCORE }}
          MIN_LIKES_FLOOR: ${{ vars.MIN_LIKES_FLOOR }}
          MAX_AGE_MINUTES: ${{ vars.MAX_AGE_MINUTES }}
          NOTIFY_MAX_PER_RUN: ${{ vars.NOTIFY_MAX_PER_RUN }}
          NOTIFY_MAX_PER_DAY: ${{ vars.NOTIFY_MAX_PER_DAY }}
          NOTIFY_MIN_INTERVAL_MINUTES: ${{ vars.NOTIFY_MIN_INTERVAL_MINUTES }}
          PUSHOVER_PRIORITY: ${{ vars.PUSHOVER_PRIORITY }}
          PUSHOVER_URGENT_PRIORITY: ${{ vars.PUSHOVER_URGENT_PRIORITY }}
          SEARCH_MIN_FAVES: ${{ vars.SEARCH_MIN_FAVES }}
          COMBO_MIN_FAVES: ${{ vars.COMBO_MIN_FAVES }}
          BROAD_MIN_FAVES: ${{ vars.BROAD_MIN_FAVES }}
          # 2026-09: within_time が0件を返す事例が増えたため強制オフ
          SEARCH_WITHIN_TIME: "off"
          RELEVANCE_FLOOR: ${{ vars.RELEVANCE_FLOOR }}
          LINE_MODE: "off"
          MAX_DETAIL_FETCH: ${{ vars.MAX_DETAIL_FETCH }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        run: python main.py

      - name: Clean up session file
        if: always()
        run: rm -f storage_state.json

      - name: Commit status.json・通知履歴・分析用ログ
        if: always()
        run: |
          set -e
          git config user.name "sns-monitor-bot"
          git config user.email "actions@github.com"
          git add status.json data/log data/notify_state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "Update status.json"
          for i in 1 2 3 4; do
            if git push; then
              echo "push成功"
              exit 0
            fi
            echo "push失敗。${i}回目のリトライ前にpull --rebaseします"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep $((2 ** i))
          done
          echo "pushに4回失敗しました"
          exit 1
