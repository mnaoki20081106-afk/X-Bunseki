name: SNS Buzz Monitor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "trueにすると、実際のX検索をせずテスト通知だけ送る"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: sns-buzz-monitor
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium firefox webkit

      - name: Restore DB
        uses: actions/cache@v4
        with:
          path: data/monitor.db
          key: monitor-db-${{ github.run_id }}
          restore-keys: |
            monitor-db-

      - name: Restore X login session
        if: github.event.inputs.test_notification != 'true'
        run: |
          set -e
          python3 << 'PY'
          import base64, json, os, pathlib, sys
          raw = os.environ.get("X_SESSION_STATE_B64", "") or ""
          raw = raw.strip()
          out = pathlib.Path("storage_state.json")
          if not raw:
              print("::warning::X_SESSION_STATE が空です。ログインが必要です。")
              out.write_text("{}", encoding="utf-8")
              sys.exit(0)
          data = None
          # 1) base64 → JSON
          try:
              decoded = base64.b64decode(raw, validate=False)
              text = decoded.decode("utf-8")
              data = json.loads(text)
              print("セッション: base64→JSON として復元しました")
          except Exception as e1:
              print(f"base64経路失敗: {e1}")
              # 2) 生JSON
              try:
                  data = json.loads(raw)
                  print("セッション: 生JSONとして復元しました")
              except Exception as e2:
                  print(f"::error::X_SESSION_STATE を解釈できません: {e2}")
                  out.write_text("{}", encoding="utf-8")
                  # 壊れた秘密を残さない
                  sys.exit(0)
          if not isinstance(data, dict):
              print("::error::storage_state がオブジェクトではありません")
              out.write_text("{}", encoding="utf-8")
              sys.exit(0)
          out.write_text(json.dumps(data, ensure_ascii=False), encoding="utf-8")
          cookies = data.get("cookies") or []
          print(f"セッション cookies={len(cookies)} 件")
          PY
        env:
          X_SESSION_STATE_B64: ${{ secrets.X_SESSION_STATE }}

      - name: Probe XActions search (HTTP client)
        if: github.event.inputs.test_notification != 'true'
        continue-on-error: true
        run: |
          set -e
          node --version
          npm install --no-save xactions@3.5.0
          cat > .xactions-probe.mjs <<'JS'
          import fs from 'node:fs';
          import { Scraper, SearchMode } from 'xactions/client';

          const state = JSON.parse(fs.readFileSync('storage_state.json', 'utf8'));
          const cookies = Object.fromEntries((state.cookies || []).map(c => [c.name, c.value]));
          const auth = cookies.auth_token;
          const ct0 = cookies.ct0;
          console.log('[xactions-probe] auth_token=' + Boolean(auth) + ' ct0=' + Boolean(ct0));
          if (!auth || !ct0) throw new Error('auth_token または ct0 がありません');

          const x = new Scraper();
          await x.setCookies(`auth_token=${auth}; ct0=${ct0}`);
          const rows = [];
          for await (const tweet of x.searchTweets('lang:ja', 3, SearchMode.Latest)) {
            rows.push({
              id: tweet.id ?? tweet.rest_id ?? null,
              likes: tweet.likes ?? tweet.favoriteCount ?? null,
              retweets: tweet.retweets ?? tweet.retweetCount ?? null,
              replies: tweet.replies ?? tweet.replyCount ?? null,
              text_length: typeof tweet.text === 'string' ? tweet.text.length : null,
              username: tweet.username ?? tweet.user?.username ?? null,
            });
            if (rows.length >= 3) break;
          }
          console.log('[xactions-probe] result_count=' + rows.length);
          console.log(JSON.stringify(rows, null, 2));
          if (rows.length === 0) throw new Error('検索結果が0件でした');
          JS
          node .xactions-probe.mjs
          rm -f .xactions-probe.mjs

      - name: Probe X with direct HTTP (no browser)
        if: github.event.inputs.test_notification != 'true'
        env:
          X_SESSION_STATE_PATH: storage_state.json
        run: |
          python3 << 'PY'
          import json, pathlib, urllib.request, urllib.error

          data=json.loads(pathlib.Path("storage_state.json").read_text(encoding="utf-8"))
          cookies={x.get("name"):x.get("value") for x in data.get("cookies",[]) if x.get("name") and x.get("value")}
          cookie="; ".join(f"{k}={v}" for k,v in cookies.items())
          req=urllib.request.Request(
              "https://x.com/home",
              headers={
                  "Cookie": cookie,
                  "User-Agent": "Mozilla/5.0",
                  "Accept-Language": "ja-JP,ja;q=0.9,en;q=0.8",
              },
          )
          try:
              with urllib.request.urlopen(req,timeout=30) as r:
                  body=r.read().decode("utf-8","replace")
                  final_url=r.geturl()
                  status=r.status
          except urllib.error.HTTPError as e:
              status=e.code
              final_url=e.geturl()
              body=e.read().decode("utf-8","replace")
          low=body.lower()
          waiting=("しばらくお待ちください" in body or "just a moment" in low)
          login=("/i/flow/login" in final_url or "/login" in final_url)
          print(f"[http-probe] status={status} final_url={final_url} bytes={len(body.encode('utf-8'))} waiting={waiting} login={login}")
          print(f"[http-probe] auth_token={bool(cookies.get('auth_token'))} ct0={bool(cookies.get('ct0'))}")
          PY

      - name: Run monitor
        env:
          X_SESSION_STATE_PATH: storage_state.json
          TEST_NOTIFICATION: ${{ github.event.inputs.test_notification }}
          DISABLE_NOTIFICATIONS: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          SCHOOL_STATUS_URL: ${{ secrets.SCHOOL_STATUS_URL }}
          SCHOOL_STATUS_SECRET: ${{ secrets.SCHOOL_STATUS_SECRET }}
          NOTIFY_SCORE: ${{ vars.NOTIFY_SCORE }}
          MIN_LIKES_FLOOR: ${{ vars.MIN_LIKES_FLOOR }}
          MAX_AGE_MINUTES: ${{ vars.MAX_AGE_MINUTES }}
          NOTIFY_MAX_PER_RUN: ${{ vars.NOTIFY_MAX_PER_RUN }}
          NOTIFY_MAX_PER_DAY: ${{ vars.NOTIFY_MAX_PER_DAY }}
          NOTIFY_MIN_INTERVAL_MINUTES: ${{ vars.NOTIFY_MIN_INTERVAL_MINUTES }}
          PUSHOVER_PRIORITY: ${{ vars.PUSHOVER_PRIORITY }}
          PUSHOVER_URGENT_PRIORITY: ${{ vars.PUSHOVER_URGENT_PRIORITY }}
          SEARCH_MIN_FAVES: ${{ vars.SEARCH_MIN_FAVES }}
          COMBO_MIN_FAVES: ${{ vars.COMBO_MIN_FAVES }}
          BROAD_MIN_FAVES: "250"
          SEARCH_WITHIN_TIME: "off"
          RELEVANCE_FLOOR: ${{ vars.RELEVANCE_FLOOR }}
          LINE_MODE: "off"
          MAX_DETAIL_FETCH: ${{ vars.MAX_DETAIL_FETCH }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          EARLY_LPM_AT_15: ${{ vars.EARLY_LPM_AT_15 }}
          EARLY_LPM_AT_60: ${{ vars.EARLY_LPM_AT_60 }}
          EARLY_BURST_BONUS: ${{ vars.EARLY_BURST_BONUS }}
        # セッション切れは status に書くだけ（ワークフロー自体は失敗扱いにしない）
        run: |
          set +e
          python main.py
          code=$?
          if [ -f status.json ]; then
            st=$(python3 -c "import json; print(json.load(open('status.json')).get('status',''))" 2>/dev/null || true)
            if [ "$st" = "session_expired" ] || [ "$st" = "error" ]; then
              echo "monitor ended with status=$st (exit=$code) — コミットは続行"
              exit 0
            fi
          fi
          exit $code

      - name: Clean up session file
        if: always()
        run: rm -f storage_state.json

      - name: Sync docs for GitHub Pages
        if: always()
        run: |
          mkdir -p docs
          cp -f status.json docs/status.json 2>/dev/null || true
          cp -f hits.json docs/hits.json 2>/dev/null || true
          cp -f hits.md docs/hits.md 2>/dev/null || true
          cp -f keywords.txt docs/keywords.txt 2>/dev/null || true

      - name: Commit status.json・hits・docs
        if: always()
        run: |
          set -e
          git config user.name "sns-monitor-bot"
          git config user.email "actions@github.com"
          git add status.json hits.md hits.json docs/status.json docs/hits.json docs/hits.md docs/keywords.txt data/log data/notify_state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "Update status.json / hits / docs"
          for i in 1 2 3 4; do
            if git push; then
              echo "push成功"
              exit 0
            fi
            echo "push失敗。${i}回目のリトライ前にpull --rebaseします"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep $((2 ** i))
          done
          echo "pushに4回失敗しました"
          exit 1
