name: X Agent Live Probe
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore cookies and test x-agent-sdk
        env:
          X_SESSION_STATE: ${{ secrets.X_SESSION_STATE }}
        run: |
          npm install --no-save x-agent-sdk@0.2.3
          cat > .x-agent-probe.mjs <<'JS'
          import { XClient } from 'x-agent-sdk';
          const raw=(process.env.X_SESSION_STATE||'').trim();
          let state;
          try { state=JSON.parse(raw); } catch { state=JSON.parse(Buffer.from(raw,'base64').toString('utf8')); }
          const c=Object.fromEntries((state.cookies||[]).map(x=>[x.name,x.value]));
          console.log('[auth] auth_token='+Boolean(c.auth_token)+' ct0='+Boolean(c.ct0));
          const x=new XClient({authToken:c.auth_token,ct0:c.ct0,retries:1});
          try {
            const r=await x.searchPage('lang:ja',3,'Latest');
            console.log('[x-agent] SUCCESS items='+(r.items?.length??0)+' cursor='+Boolean(r.next_cursor));
            console.log(JSON.stringify((r.items||[]).slice(0,3).map(t=>({id:t.id,url:t.url,text_length:t.text?.length??0,likes:t.likes??null}))));
            if(!(r.items||[]).length) process.exitCode=2;
          } catch(e) {
            console.log('[x-agent] FAILED name='+(e.name||'')+' status='+(e.status||e.statusCode||'')+' code='+(e.code||''));
            console.log('[x-agent] message='+e.message);
            process.exitCode=1;
          }
          JS
          node .x-agent-probe.mjs
