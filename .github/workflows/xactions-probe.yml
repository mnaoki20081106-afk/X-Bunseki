name: XActions Probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore X session
        env:
          X_SESSION_STATE: ${{ secrets.X_SESSION_STATE }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const raw=(process.env.X_SESSION_STATE||'').trim();
          let state;
          try {
            state=JSON.parse(raw);
          } catch {
            state=JSON.parse(Buffer.from(raw,'base64').toString('utf8'));
          }
          fs.writeFileSync('storage_state.json',JSON.stringify(state));
          const names=new Set((state.cookies||[]).map(c=>c.name));
          console.log('[session] auth_token='+names.has('auth_token')+' ct0='+names.has('ct0'));
          JS

      - name: Probe adaptive search through Deno Deploy
        continue-on-error: true
        run: |
          URL="https://x-bunseki.mnaoki20081106-afk.deno.net/adaptive-probe"
          echo "[adaptive] GET $URL"
          body=$(curl -fsSL --max-time 30 "$URL")
          echo "$body"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.ok) process.exit(1)' "$body"
          echo "[adaptive] SUCCESS"

      - name: Install latest XActions
        run: npm install --no-save github:nirholas/XActions#main

      - name: Discover live query IDs and search
        continue-on-error: true
        run: |
          cat > .xactions-fast-probe.mjs <<'JS'
          import fs from 'node:fs';
          import { Scraper, SearchMode } from 'xactions/client';
          import { refreshQueryIds, getQueryId } from './node_modules/xactions/src/scrapers/twitter/http/queryIds.js';

          try {
            const d=await refreshQueryIds({scope:'core'});
            console.log('[query-id] discovery=success count='+d.count+' SearchTimeline='+getQueryId('SearchTimeline'));
          } catch(e) {
            console.log('[query-id] discovery=failed '+e.message);
            console.log('[query-id] fallback SearchTimeline='+getQueryId('SearchTimeline'));
          }

          const state=JSON.parse(fs.readFileSync('storage_state.json','utf8'));
          const cookies=Object.fromEntries((state.cookies||[]).map(c=>[c.name,c.value]));
          const x=new Scraper();
          await x.setCookies(`auth_token=${cookies.auth_token}; ct0=${cookies.ct0}`);
          const rows=[];
          try {
            for await (const t of x.searchTweets('lang:ja',3,SearchMode.Latest)) {
              rows.push({id:t.id??null,likes:t.likes??null,text_length:t.text?.length??null});
              if(rows.length>=3) break;
            }
            console.log('[search] SUCCESS count='+rows.length);
            console.log(JSON.stringify(rows));
            if(!rows.length) process.exitCode=2;
          } catch(e) {
            console.log('[search] FAILED code='+(e.code||'')+' http='+(e.httpStatus||'')+' endpoint='+(e.endpoint||''));
            console.log('[search] message='+e.message);
            process.exitCode=1;
          }
          JS
          node .xactions-fast-probe.mjs

      - name: Probe SearchTimeline through Deno Deploy
        run: |
          set -e
          URL="https://x-bunseki.mnaoki20081106-afk.deno.net/graphql-probe"
          echo "[deno] GET $URL"
          body=$(curl -fsSL --max-time 30 "$URL")
          echo "$body"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.ok || x.status!==200 || !x.has_search_timeline) process.exit(1)' "$body"
          echo "[deno] SUCCESS"

      - name: Clean
        if: always()
        run: rm -f storage_state.json .xactions-fast-probe.mjs
