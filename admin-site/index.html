<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal Filter · Read only</title>
<style>
:root{color-scheme:dark;--bg:#101316;--surface:#171b1f;--border:#2a3038;--text:#e7eaed;--muted:#8b939c;--accent:#8ee8ff;--ok:#5fb587}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:36px 20px 80px}.eyebrow{font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;color:var(--accent)}
h1{font-size:26px;margin:8px 0 10px}.lead{color:var(--muted);line-height:1.8;font-size:14px}.notice{margin:24px 0;padding:16px;border:1px solid #8ee8ff33;border-radius:14px;background:#8ee8ff0a;line-height:1.7;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}.stat,.hit{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:14px}.stat span{display:block;color:var(--muted);font-size:10px}.stat strong{display:block;margin-top:5px;font-size:20px}
.hit{margin-bottom:9px}.top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.score{color:var(--accent);font-weight:700}.meta{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.text{margin:8px 0;color:#cbd2d8;font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}a{color:var(--accent);font-size:12px}.empty{padding:36px;text-align:center;color:var(--muted)}
@media(max-width:560px){.stats{grid-template-columns:1fr}.wrap{padding-inline:14px}}
</style>
</head>
<body>
<main class="wrap">
  <p class="eyebrow">X-BUNSEKI · LEGACY VIEWER</p>
  <h1>旧キーワード管理画面は読み取り専用になりました</h1>
  <p class="lead">キーワード編集は親Webアプリの認証済み管理画面へ移行しました。このページから監視設定を変更することはできません。</p>
  <div class="notice"><strong>Security migration</strong><br>この静的ページにはキーワード書き込みAPI・POST処理・認証情報を一切含めません。以下は公開可能な監視結果の表示だけです。</div>
  <section class="stats">
    <div class="stat"><span>監視状態</span><strong id="status">—</strong></div>
    <div class="stat"><span>足切り通過</span><strong id="surviving">—</strong></div>
    <div class="stat"><span>候補</span><strong id="candidates">—</strong></div>
  </section>
  <section id="hits"><div class="empty">読み込み中...</div></section>
</main>
<script>
const HITS=["https://raw.githubusercontent.com/mnaoki20081106-afk/X-Bunseki/main/hits.json"];
const STATUS=["https://raw.githubusercontent.com/mnaoki20081106-afk/X-Bunseki/main/status.json"];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function firstJson(urls){let last;for(const u of urls){try{const r=await fetch(u+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}catch(e){last=e}}throw last}
(async()=>{
  try{
    const [hits,status]=await Promise.all([firstJson(HITS),firstJson(STATUS)]);
    document.getElementById("status").textContent=status.status||"unknown";
    document.getElementById("surviving").textContent=hits.surviving??"—";
    document.getElementById("candidates").textContent=hits.candidates??"—";
    const posts=[...(hits.early_posts||[]),...(hits.trending_posts||[])].slice(0,40);
    document.getElementById("hits").innerHTML=posts.length?posts.map(p=>`<article class="hit"><div class="top"><span class="score">${Math.round(p.score??0)}点</span><span class="meta">@${esc(p.author||"")} · ${Number(p.impressions||0).toLocaleString()} imp</span></div><div class="text">${esc(p.text||"(本文なし)")}</div>${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">投稿をXで開く →</a>`:""}</article>`).join(""):'<div class="empty">表示できる投稿がありません。</div>';
  }catch(e){document.getElementById("hits").innerHTML='<div class="empty">監視データを取得できませんでした。</div>'}
})();
</script>
</body>
</html>
