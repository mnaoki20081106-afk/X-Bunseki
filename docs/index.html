<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>X監視 | ProfileHub Studio</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#163c4c 0,transparent 42%),#07090b;color:#edf7fa;padding:24px}
.card{width:min(100%,620px);padding:46px 34px;border:1px solid #ffffff18;border-radius:28px;background:linear-gradient(145deg,#12181d,#0a0d10);box-shadow:0 32px 100px #0009;text-align:center}
.lock{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 22px;border:1px solid #efbd6940;border-radius:22px;background:#211b13;color:#ffd28d;font-size:32px}
.eyebrow{margin:0;color:#78d9f7;font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em}
h1{margin:10px 0 0;font-size:clamp(28px,7vw,44px);letter-spacing:-.045em}
p{margin:20px auto 0;max-width:500px;color:#9ba7af;font-size:14px;line-height:1.9}
a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin-top:30px;padding:0 24px;border-radius:999px;background:linear-gradient(120deg,#c9f3ff,#6fd6f5);color:#062733;text-decoration:none;font-size:13px;font-weight:700}
.note{font-size:11px;color:#68737c}
</style>
</head>
<body>
<main class="card">
  <div class="lock" aria-hidden="true">🔒</div>
  <p class="eyebrow">X MONITOR · PRIVATE ACCESS</p>
  <h1>X監視の公開ページは終了しました</h1>
  <p>
    このURLから監視結果を閲覧することはできません。
    X監視はProfileHub Studioの認証済みユーザー向け機能へ移行しました。
    サイト作成機能はこれまで通り無料です。
  </p>
  <a href="https://post-link.net/x-monitor" rel="noreferrer">X監視を開く →</a>
  <p class="note">利用には、管理者による個別許可または有効な月額サービスが必要です。</p>
</main>
</body>
</html>
