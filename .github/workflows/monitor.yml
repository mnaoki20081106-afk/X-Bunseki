name: SNS Buzz Monitor

on:
  push:
    branches: [main]
    paths: [".github/manual-monitor-trigger"]
  schedule:
    # GitHub Actions cronは毎時00分付近が混雑しやすいため、11分基準で15分間隔。
    - cron: "11,26,41,56 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "trueにすると、実際のX検索をせずテスト通知だけ送る"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: sns-buzz-monitor
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install --no-save x-agent-sdk@0.2.3

      - name: Restore DB
        uses: actions/cache@v4
        with:
          path: data/monitor.db
          key: monitor-db-${{ github.run_id }}
          restore-keys: |
            monitor-db-

      - name: Restore X login session
        if: github.event.inputs.test_notification != 'true'
        run: |
          set -e
          python3 << 'PY'
          import base64, json, os, pathlib, sys
          raw = os.environ.get("X_SESSION_STATE_B64", "") or ""
          raw = raw.strip()
          out = pathlib.Path("storage_state.json")
          if not raw:
              print("::warning::X_SESSION_STATE が空です。ログインが必要です。")
              out.write_text("{}", encoding="utf-8")
              sys.exit(0)
          data = None
          # 1) base64 → JSON
          try:
              decoded = base64.b64decode(raw, validate=False)
              text = decoded.decode("utf-8")
              data = json.loads(text)
              print("セッション: base64→JSON として復元しました")
          except Exception as e1:
              print(f"base64経路失敗: {e1}")
              # 2) 生JSON
              try:
                  data = json.loads(raw)
                  print("セッション: 生JSONとして復元しました")
              except Exception as e2:
                  print(f"::error::X_SESSION_STATE を解釈できません: {e2}")
                  out.write_text("{}", encoding="utf-8")
                  # 壊れた秘密を残さない
                  sys.exit(0)
          if not isinstance(data, dict):
              print("::error::storage_state がオブジェクトではありません")
              out.write_text("{}", encoding="utf-8")
              sys.exit(0)
          out.write_text(json.dumps(data, ensure_ascii=False), encoding="utf-8")
          cookies = data.get("cookies") or []
          print(f"セッション cookies={len(cookies)} 件")
          PY
        env:
          X_SESSION_STATE_B64: ${{ secrets.X_SESSION_STATE }}

      - name: Run monitor
        env:
          X_SESSION_STATE_PATH: storage_state.json
          TEST_NOTIFICATION: ${{ github.event.inputs.test_notification }}
          DISABLE_NOTIFICATIONS: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          SCHOOL_STATUS_URL: ${{ secrets.SCHOOL_STATUS_URL }}
          SCHOOL_STATUS_SECRET: ${{ secrets.SCHOOL_STATUS_SECRET }}
          NOTIFY_SCORE: ${{ vars.NOTIFY_SCORE }}
          MIN_LIKES_FLOOR: ${{ vars.MIN_LIKES_FLOOR }}
          MAX_AGE_MINUTES: ${{ vars.MAX_AGE_MINUTES }}
          NOTIFY_MAX_PER_RUN: ${{ vars.NOTIFY_MAX_PER_RUN }}
          NOTIFY_MAX_PER_DAY: ${{ vars.NOTIFY_MAX_PER_DAY }}
          NOTIFY_MIN_INTERVAL_MINUTES: ${{ vars.NOTIFY_MIN_INTERVAL_MINUTES }}
          PUSHOVER_PRIORITY: ${{ vars.PUSHOVER_PRIORITY }}
          PUSHOVER_URGENT_PRIORITY: ${{ vars.PUSHOVER_URGENT_PRIORITY }}
          SEARCH_MIN_FAVES: ${{ vars.SEARCH_MIN_FAVES }}
          COMBO_MIN_FAVES: ${{ vars.COMBO_MIN_FAVES }}
          BROAD_MIN_FAVES: "250"
          SEARCH_WITHIN_TIME: "off"
          RELEVANCE_FLOOR: ${{ vars.RELEVANCE_FLOOR }}
          LINE_MODE: "off"
          MAX_DETAIL_FETCH: ${{ vars.MAX_DETAIL_FETCH }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          EARLY_LPM_AT_15: ${{ vars.EARLY_LPM_AT_15 }}
          EARLY_LPM_AT_60: ${{ vars.EARLY_LPM_AT_60 }}
          EARLY_BURST_BONUS: ${{ vars.EARLY_BURST_BONUS }}
        # セッション切れは status に書くだけ（ワークフロー自体は失敗扱いにしない）
        run: |
          set +e
          python main.py
          code=$?
          python auto_train.py || true
          if [ -f status.json ]; then
            st=$(python3 -c "import json; print(json.load(open('status.json')).get('status',''))" 2>/dev/null || true)
            if [ "$st" = "session_expired" ] || [ "$st" = "error" ]; then
              echo "monitor ended with status=$st (exit=$code) — コミットは続行"
              exit 0
            fi
          fi
          exit $code

      - name: Clean up session file
        if: always()
        run: rm -f storage_state.json

      - name: Sync docs for GitHub Pages
        if: always()
        run: |
          mkdir -p docs
          cp -f status.json docs/status.json 2>/dev/null || true
          cp -f hits.json docs/hits.json 2>/dev/null || true
          cp -f hits.md docs/hits.md 2>/dev/null || true
          cp -f keywords.txt docs/keywords.txt 2>/dev/null || true

      - name: Commit status.json・hits・docs
        if: always()
        run: |
          set -e
          git config user.name "sns-monitor-bot"
          git config user.email "actions@github.com"
          # mainの最新状態を基準にしつつ、このrunで生成したファイルを確実に保持する。
          # 存在する生成物だけをstageする。存在しない任意ファイルをpathspecに
          # 混ぜると git add 全体が失敗するため、個別に確認する。
          for p in status.json hits.md hits.json docs/status.json docs/hits.json docs/hits.md docs/keywords.txt data/log data/notify_state.json data/training_snapshots.jsonl data/impression_model.json data/watchlist.json; do
            if [ -e "$p" ]; then
              git add -f "$p"
            fi
          done
          echo "生成物の差分:"
          git status --short
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "Update monitor results"
          for i in 1 2 3 4; do
            if git push; then
              echo "push成功"
              exit 0
            fi
            echo "push失敗。${i}回目のリトライ前にpull --rebaseします"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep $((2 ** i))
          done
          echo "pushに4回失敗しました"
          exit 1
