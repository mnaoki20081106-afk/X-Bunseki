name: SNS Buzz Monitor

on:
  schedule:
    # 毎時7分に実行 (UTC基準。日本時間は+9時間)
    # ★毎時0分を避けている理由: GitHubの仕様上、毎時0分は世界中の
    #   ワークフローが集中し、実行の遅延・スキップが起きやすいと
    #   公式ドキュメントで明記されているため。実際に2時間以上の
    #   遅延が発生したことを受けて、この時刻に変更した(2026-08)。
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "trueにすると、実際のX検索をせずテスト通知だけ送る(「通知確認」機能用)"
        required: false
        default: "false"

permissions:
  contents: write  # status.json をリポジトリにcommit&pushするために必要

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        if: github.event.inputs.test_notification != 'true'
        run: playwright install --with-deps chromium

      - name: Restore DB (重複通知防止用)
        uses: actions/cache@v4
        with:
          path: data/monitor.db
          key: monitor-db-${{ github.run_id }}
          restore-keys: |
            monitor-db-

      - name: Restore X login session
        if: github.event.inputs.test_notification != 'true'
        run: echo "${{ secrets.X_SESSION_STATE }}" | base64 -d > storage_state.json

      - name: Run monitor
        env:
          X_SESSION_STATE_PATH: storage_state.json
          TEST_NOTIFICATION: ${{ github.event.inputs.test_notification }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: python main.py

      - name: Clean up session file
        if: always()
        run: rm -f storage_state.json

      - name: Commit status.json (動作確認用)
        if: always()
        run: |
          git config user.name "sns-monitor-bot"
          git config user.email "actions@github.com"
          git add status.json
          git diff --staged --quiet || git commit -m "Update status.json"
          git push
